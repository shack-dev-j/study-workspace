<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Study Workspace</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preload" href="/vendor/inter/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/modules.css">
  <link rel="stylesheet" href="/css/v3.css">
  <script>
    // Apply the saved theme before the page paints (no flash).
    try {
      var t = localStorage.getItem('sw-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
      var f = localStorage.getItem('sw-font');
      if (f === 'rubik') document.documentElement.dataset.font = f;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main menu">
      <div class="brand">
        <img src="/icon.svg" alt="" width="26" height="26">
        <span>Study Workspace<small id="brandSub">Plan · focus · study</small></span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <button class="icon-btn tonal" id="themeBtn" type="button" title="Switch dark / light" aria-label="Switch dark / light"></button>
        <a class="icon-btn" href="#/settings" title="Settings" aria-label="Settings"><span data-icon="settings"></span></a>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"></button>
        <h1 class="page-title" id="pageTitle">Today</h1>
        <div class="top-actions">
          <a class="focus-chip" id="focusChip" href="#/focus" hidden></a>
          <a class="timer-chip" id="timerChip" href="#/time" hidden></a>
          <button class="search-btn" id="searchBtn" type="button" title="Search (Ctrl+K)">
            <span class="ico" data-icon="search"></span><span class="label">Search everything</span><kbd>Ctrl K</kbd>
          </button>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Study Workspace needs JavaScript.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
